<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Package Menu · Chamtaburu</title>
<meta name="description" content="Bed tea, breakfast, lunch, evening snacks and dinner: home-style meals included in your stay package at Chamtaburu.">
<!-- WhatsApp preview card. Absolute URLs must name a real host, so this file
     carries the Village's; scripts/generate-seo.mjs swaps in the Resort's for
     the Resort build. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Chamtaburu Eco Village">
<meta property="og:title" content="Package Menu · Chamtaburu Eco Village">
<meta property="og:description" content="Bed tea, breakfast, lunch, evening snacks and dinner: home-style meals included in your stay package.">
<meta property="og:image" content="https://chamtaburu.in/img/village/village-hero-hills-960.jpg">
<meta property="og:image:width" content="960">
<meta property="og:image:height" content="720">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/package/package.css?v=2">
<style>
.share{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0 4px}
.menu{padding:20px 20px 10px}
.note{text-align:center;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.15rem;color:var(--muted);margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--forest);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:9}
footer{background:var(--forest);color:var(--paper);text-align:center;padding:30px 16px 38px;margin-top:28px;font-size:.92rem}
footer h2{margin:0 0 4px;font-size:1.5rem}
footer p{margin:4px 0;opacity:.9}
footer a{color:inherit;text-underline-offset:3px}
footer .calls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 10px}
footer .calls a{border:1px solid rgba(255,255,255,.5);padding:9px 18px;border-radius:999px;text-decoration:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) footer{color:var(--bg)} :root:not([data-theme="light"]) footer .calls a{border-color:rgba(0,0,0,.4)}}
:root[data-theme="dark"] footer{color:var(--bg)}
:root[data-theme="dark"] footer .calls a{border-color:rgba(0,0,0,.4)}
/* One A4 page: no buttons or hills, tighter spacing, calls as plain text. */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000;font-size:14px}
  .share,.hills,.toast{display:none!important}
  .hero{padding-top:0}
  .hero h1{font-size:2.6rem}
  .hero p.tag{margin-top:4px}
  .card{border-color:#ccc;margin:10px 0;padding:12px 16px 4px}
  ol.day>li{padding:7px 0;break-inside:avoid}
  ol.day h3{font-size:1.2rem}
  ul.dishes{gap:4px;margin-top:3px}
  ul.legend{margin-bottom:6px}
  .note{font-size:1rem;margin:0}
  footer{background:none;color:#000;border-top:1px solid #ccc;margin-top:10px;padding:10px 0 0}
  footer .calls{margin:6px 0}
  footer .calls a{border:none;padding:0 8px}
}
</style>
</head>
<body>

<header class="hero">
  <p class="kicker">All meals included</p>
  <h1>Package Menu</h1>
  <p class="tag" id="propTag">Home-style food, cooked fresh in our kitchen.</p>
  <svg class="hills" viewBox="0 0 1200 190" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0 120 C150 60 260 70 380 105 S620 40 760 80 S1020 50 1200 95 V190 H0Z" fill="var(--hill1)"/>
    <path d="M0 150 C180 110 300 125 460 140 S760 95 920 130 S1100 120 1200 135 V190 H0Z" fill="var(--hill2)"/>
    <path d="M0 175 C220 150 420 165 600 170 S980 150 1200 168 V190 H0Z" fill="var(--hill3)"/>
    <g fill="var(--hill3)"><rect x="196" y="98" width="6" height="60"/><ellipse cx="199" cy="92" rx="26" ry="30"/></g>
    <g fill="var(--hill3)"><rect x="1012" y="92" width="6" height="60"/><ellipse cx="1015" cy="86" rx="22" ry="28"/></g>
    <g fill="var(--palash)"><circle cx="186" cy="82" r="5"/><circle cx="210" cy="76" r="4"/><circle cx="200" cy="98" r="4"/><circle cx="218" cy="95" r="3"/></g>
    <g fill="var(--palash)"><circle cx="1004" cy="78" r="4"/><circle cx="1026" cy="72" r="5"/><circle cx="1018" cy="92" r="3"/></g>
    <g fill="var(--palash)"><circle cx="600" cy="30" r="14" opacity=".9"/></g>
  </svg>
</header>

<main class="wrap">
  <div class="share">
    <button class="btn wa" type="button" id="share">Share</button>
    <button class="btn" type="button" id="copyText">Copy menu as text</button>
    <button class="btn" type="button" id="print">Save as PDF</button>
  </div>
  <div class="card menu" id="menu"></div>
  <p class="note" id="note"></p>
</main>

<footer>
  <h2 id="footName">Chamtaburu</h2>
  <p id="footAddr"></p>
  <div class="calls" id="calls"></div>
  <p><a id="footSite" href="https://chamtaburu.in">chamtaburu.in</a></p>
</footer>

<p class="toast" id="toast" role="status" hidden></p>

<script src="/package/rates.js?v=2"></script>
<script src="/package/package-core.js?v=2"></script>
<script src="/package/menu.js?v=2"></script>
</body>
</html>
