<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Package Generator · Chamtaburu</title>
<link rel="stylesheet" href="/package/package.css">
<style>
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 0}
.top h1{margin:0;font-size:1.7rem;color:var(--forest);line-height:1.1}
.top .who{font-size:.85rem;color:var(--muted);text-align:right}

/* Lock screen */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lock .card{width:100%;max-width:360px;text-align:center}
.lock h1{margin:0 0 4px;color:var(--forest);font-size:2rem}
.lock input{text-align:center;font-size:1.6rem;letter-spacing:.5em;margin:14px 0 10px}
.lock .err{color:var(--warn);min-height:1.5em;font-size:.9rem;margin:0}

/* Room and add-on rows */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 72px auto;gap:8px;align-items:center;margin-bottom:8px}
.row .ac{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
.row .ac.off{visibility:hidden}
.addon{display:grid;grid-template-columns:auto minmax(0,1fr) auto 64px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.addon:last-child{border-bottom:none}
.addon .p{font-size:.85rem;color:var(--muted);white-space:nowrap}
.addon input[type=number]{padding:6px 8px}
.addon input[type=number]:disabled{opacity:.4}
.inline{display:flex;gap:8px}
.inline select{width:auto;flex:0 0 auto}
.hint{font-size:.84rem;color:var(--muted);margin:6px 0 0}

/* Sticky action bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .wrap{display:flex;align-items:center;gap:8px;padding:0}
.bar .tot{flex:1 1 auto;min-width:0;line-height:1.2}
.bar .tot b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.bar .tot span{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--forest);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:6}
@media (max-width:520px){
  .row{grid-template-columns:minmax(0,1fr) 64px auto}
  .row .ac{grid-column:1/-1;grid-row:2}
  .row .ac.off{display:none}
  .bar .btn.copy{display:none}
}
</style>
</head>
<body>

<section class="lock" id="lock">
  <form class="card" id="lockForm" autocomplete="off">
    <p class="muted" style="margin:0">Chamtaburu</p>
    <h1>Package Generator</h1>
    <p class="muted" style="margin:0">Managers only. Enter your PIN.</p>
    <label for="pin" class="muted" style="position:absolute;left:-9999px">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" required>
    <p class="err" id="pinErr" role="alert"></p>
    <button class="btn primary" type="submit" style="width:100%">Unlock</button>
  </form>
</section>

<div id="app" hidden>
  <div class="wrap">
    <div class="top">
      <h1>Package Generator</h1>
      <div class="who"><span id="who"></span><br><button class="btn small" id="logout" type="button">Lock</button></div>
    </div>

    <p class="banner" id="placeholderBanner" hidden><strong>Placeholder prices.</strong> Some rates, add-ons and terms are not confirmed yet. Check the total before you send.</p>

    <form id="form" autocomplete="off">
      <div class="card">
        <h2>Property</h2>
        <label class="f">Property<select id="prop"></select></label>
      </div>

      <div class="card">
        <h2>Guest &amp; dates</h2>
        <div class="grid">
          <label class="f">Guest name<input id="gName" required placeholder="e.g. Ananya Roy"></label>
          <label class="f">Guest WhatsApp number<input id="gPhone" type="tel" inputmode="tel" required placeholder="98765 43210"></label>
          <label class="f">Check-in<input id="ci" type="date" required></label>
          <label class="f">Check-out<input id="co" type="date" required></label>
          <label class="f">Adults<input id="adults" type="number" min="1" max="60" value="2"></label>
          <label class="f">Children<input id="children" type="number" min="0" max="30" value="0"></label>
        </div>
        <p class="hint" id="nightsHint"></p>
      </div>

      <div class="card">
        <h2>Rooms</h2>
        <div id="rooms"></div>
        <button class="btn small" type="button" id="addRoom">+ Add room</button>
      </div>

      <div class="card">
        <h2>Meals &amp; extras</h2>
        <div class="grid">
          <label class="f full">Meal plan<select id="meal"></select></label>
          <label class="f">Extra adults (per night)<input id="extraAdult" type="number" min="0" value="0"></label>
          <label class="f" id="extraChildLbl">Extra children (per night)<input id="extraChild" type="number" min="0" value="0"></label>
          <label class="f">Extra beds (per night)<input id="extraBed" type="number" min="0" value="0"></label>
        </div>
      </div>

      <div class="card">
        <h2>Add-ons</h2>
        <div id="addons"></div>
      </div>

      <div class="card">
        <h2>Price</h2>
        <table class="lines" id="breakdown"></table>
        <ul class="warnings" id="warnings"></ul>
        <div class="grid" style="margin-top:14px">
          <label class="f">Discount
            <span class="inline"><input id="discount" type="number" min="0" value="0"><select id="discountType" aria-label="Discount type"><option value="amt">₹</option><option value="pct">%</option></select></span>
          </label>
          <label class="f">Special final price, incl. GST (optional)<input id="override" type="number" min="0" placeholder="Leave blank to use the rate card"></label>
          <label class="f">GST %<input id="gst" type="number" min="0" max="28" step="0.5"></label>
          <label class="f">Advance to confirm (%)<input id="advancePct" type="number" min="0" max="100"></label>
          <label class="f">Quote valid until<input id="validUntil" type="date"></label>
        </div>
      </div>

      <div class="card">
        <h2>Inclusions &amp; notes</h2>
        <div class="grid">
          <label class="f full">Inclusions (one per line)<textarea id="inclusions"></textarea></label>
          <label class="f full">Exclusions (one per line)<textarea id="exclusions"></textarea></label>
          <label class="f full">Note for the guest (optional)<textarea id="note" placeholder="e.g. Early check-in on request. Bonfire on the lawn after 7 pm."></textarea></label>
        </div>
      </div>

      <p style="text-align:center;margin:20px 0"><button class="btn" type="button" id="reset">Start a new package</button></p>
    </form>
  </div>

  <div class="bar"><div class="wrap">
    <div class="tot"><b id="barTotal">₹0</b><span id="barSub">Total incl. GST</span></div>
    <button class="btn copy" type="button" id="copy">Copy</button>
    <button class="btn" type="button" id="preview">Preview</button>
    <button class="btn wa" type="button" id="send">Send on WhatsApp</button>
  </div></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="/package/rates.js"></script>
<script src="/package/package-core.js"></script>
<script src="/package/generator.js"></script>
</body>
</html>
